name: smart_home_ble
description: Smart Home BLE Controller — Control Arduino appliances via Bluetooth Low Energy.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE communication
  flutter_blue_plus: ^1.35.2

  # State management
  provider: ^6.1.2

  # UI utilities
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
